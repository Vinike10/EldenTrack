<!DOCTYPE html>
<html lang="pt-BR" data-theme="erdtree">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EldenTrack — Site para meus amigos do Elden ring</title>
  
  <!-- SEO & Meta Tags -->
  <meta name="description" content="Compêndio definitivo de armas lendárias, talismãs primordiais, feitiços, lágrimas e segredos de Elden Ring e Shadow of the Erdtree com guias passo a passo de rota e combate." />
  <meta name="keywords" content="Elden Ring, EldenTrack, tracker, armas lendárias, talismãs, feitiços, cinzas da guerra, shadow of the erdtree, guia elden ring, localização armas" />
  <meta name="author" content="EldenTrack" />
  <meta name="theme-color" content="#0e121a" />

  <!-- Google Fonts: Cinzel (Serif) & Outfit (Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/main.css" />

  <!-- Diagnostics & Error Catcher Script -->
  <script>
    window.__eldentrack_logs = [];
    function logMessage(type, msg) {
      console[type](msg);
      window.__eldentrack_logs.push({ type, msg, time: new Date().toLocaleTimeString() });
    }
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var errText = 'Erro detectado: ' + msg + ' (Linha ' + lineNo + ')';
      logMessage('error', errText);
      var banner = document.getElementById('error-banner');
      if (banner) {
        banner.style.display = 'block';
        banner.innerHTML = '<strong>⚠️ Erro na Execução:</strong> ' + msg + '<br><small>Arquivo: ' + url + ':' + lineNo + '</small>';
      }
      return false;
    };
  </script>
</head>
<body>

  <!-- Error / Diagnostics Banner (Exibido apenas em caso de exceção crítica) -->
  <div id="error-banner" style="display: none; background: #ef4444; color: #fff; padding: 12px 20px; font-size: 0.9rem; font-family: monospace; z-index: 9999; border-bottom: 2px solid #fff;"></div>

  <!-- Header Root -->
  <div id="header-root"></div>

  <!-- Main Application Container -->
  <main class="app-main">
    
    <!-- Slim Contextual Hero Bar Root -->
    <div id="hero-bar-root"></div>

    <!-- Filter Bar Root -->
    <section id="filter-bar-root"></section>

    <!-- Content / Grid Area with Skeleton Lazy Loading Container -->
    <section class="lazy-container">
      <!-- Skeleton Loading State View -->
      <div id="skeleton-grid-view" class="skeleton-view hidden"></div>

      <!-- Loaded Content View -->
      <div id="items-grid-view" class="loaded-view active"></div>
    </section>

  </main>

  <!-- Modals & Overlays Root -->
  <div id="modal-root"></div>
  <div id="stats-modal-root"></div>

  <!-- Toast Container Root -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Footer -->
  <footer class="app-footer">
    <p>EldenTrack &copy; 2026 &bull; Desenvolvido para nobres Maculados &bull; Elden Ring &trade; &copy; Bandai Namco / FromSoftware</p>
  </footer>

  <!-- Universal Script Bundle (Executa instantaneamente em file:/// e HTTP) -->
  <script src="./js/eldentrack-bundle.js"></script>
</body>
</html>
